# Nginx reverse proxy for the RISE Signal System.
#
# Install:
#   sudo cp deploy/nginx-rise.conf /etc/nginx/sites-available/rise
#   sudo ln -s /etc/nginx/sites-available/rise /etc/nginx/sites-enabled/rise
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add HTTPS with certbot (recommended):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com
#
# The API process (rise-api) serves both the website (public/) and /api on
# 127.0.0.1:3000 — keep that port bound to localhost and let nginx face the world.

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain, or use the VPS IP (51.81.87.144) for testing.
    server_name your-domain.com;

    # Reasonable upload/permessage limits for a JSON API.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
